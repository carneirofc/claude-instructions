<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>My App</title>
  <!-- Scalable app icon: a tile with a wide margin (survives round/squircle masks),
       no text, readable at 16 px. Installed as hicolor/scalable/apps/<APP_ID>.svg. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1d82c9"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#tile)"/>
  <rect x="16" y="18" width="32" height="26" rx="3" fill="#fcfcfc"/>
  <path d="M19 40l8-10 6 7 4-4 8 7z" fill="#1d82c9"/>
  <circle cx="40" cy="25" r="3" fill="#f67400"/>
</svg>
