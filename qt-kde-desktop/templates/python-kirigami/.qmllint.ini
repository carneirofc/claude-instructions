; qmllint for QML backed by Python objects. PySide6 registers no static types, so QML sees
; controllers as plain QtObject and the i18n() functions come from a context object:
; those two checks only produce noise here. Everything else (syntax, imports, bindings,
; deprecations, required properties) stays on.
;   /usr/lib/qt6/bin/qmllint -I /usr/lib/qt6/qml src/myapp/qml/**/*.qml
[General]
DisableDefaultImports=false

[Warnings]
MissingProperty=disable
UnqualifiedAccess=disable
